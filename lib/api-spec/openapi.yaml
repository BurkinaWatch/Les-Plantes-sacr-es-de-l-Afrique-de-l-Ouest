openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: API is ready to accept traffic
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
        "503":
          description: API is not ready to accept traffic
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
          enum: [ready, not_ready]
        ready:
          type: boolean
        checks:
          type: object
          properties:
            database:
              type: string
              enum: [missing, checking, ready, unavailable]
            jwt:
              type: string
              enum: [missing, configured]
          required: [database, jwt]
        message:
          type: string
      required:
        - status
        - ready
        - checks
        - message

