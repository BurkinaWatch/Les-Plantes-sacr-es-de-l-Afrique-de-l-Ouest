openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Username and password authentication
  - name: subscriptions
    description: Subscription and payment preparation operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: API is ready to accept traffic
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
        "503":
          description: API is not ready to accept traffic
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /auth/register:
    post:
      operationId: registerAccount
      tags: [auth]
      summary: Create an account with a username and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthCredentials"
      responses:
        "201":
          description: Account created and signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          description: Username is already taken
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /auth/login:
    post:
      operationId: loginAccount
      tags: [auth]
      summary: Sign in with a username and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthCredentials"
      responses:
        "200":
          description: Signed-in user and bearer token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /subscriptions/plans:
    get:
      operationId: getSubscriptionPlans
      tags: [subscriptions]
      summary: List available subscription plans
      responses:
        "200":
          description: Subscription plans
          content:
            application/json:
              schema:
                type: object
                required: [plans]
                properties:
                  plans:
                    type: array
                    items:
                      $ref: "#/components/schemas/SubscriptionPlan"
  /subscriptions/status:
    get:
      operationId: getSubscriptionStatus
      tags: [subscriptions]
      summary: Get the authenticated user's latest subscription
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current subscription, if any
          content:
            application/json:
              schema:
                type: object
                required: [subscription]
                properties:
                  subscription:
                    oneOf:
                      - $ref: "#/components/schemas/SubscriptionStatus"
                      - type: "null"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /subscriptions/reconcile:
    post:
      operationId: reconcileSubscriptionPayment
      tags: [subscriptions]
      summary: Reconcile pending hosted checkout sessions
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Checkout sessions checked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubscriptionReconciliation"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          description: Payments are not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /subscriptions/create-payment:
    post:
      operationId: createSubscriptionPayment
      tags: [subscriptions]
      summary: Create a hosted checkout for a configured subscription plan
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSubscriptionPaymentRequest"
      responses:
        "201":
          description: Hosted checkout created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubscriptionPayment"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          description: Payments are not configured or plan pricing is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    Unauthorized:
      description: Authentication required
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    TooManyRequests:
      description: Too many authentication attempts
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
  schemas:
    ApiError:
      type: object
      required: [error]
      properties:
        code:
          type: string
        error:
          type: string
    AuthCredentials:
      type: object
      additionalProperties: false
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 30
          pattern: "^[A-Za-z0-9_]+$"
        password:
          type: string
          minLength: 6
          maxLength: 128
    AuthUser:
      type: object
      required: [id, username]
      properties:
        id:
          type: integer
        username:
          type: string
    AuthSession:
      type: object
      required: [token, user]
      properties:
        token:
          type: string
        user:
          $ref: "#/components/schemas/AuthUser"
    SubscriptionPlan:
      type: object
      required: [code, name, period, active]
      properties:
        code:
          type: string
          enum: [MONTHLY, YEARLY]
        name:
          type: string
        description:
          type: string
          nullable: true
        amount:
          type: string
          nullable: true
        currency:
          type: string
          nullable: true
        period:
          type: string
          enum: [MONTHLY, YEARLY]
        active:
          type: boolean
    SubscriptionStatus:
      type: object
      required: [id, planCode, planName, period, status]
      properties:
        id:
          type: integer
        planCode:
          type: string
        planName:
          type: string
        period:
          type: string
        status:
          type: string
          enum: [PENDING, ACTIVE, FAILED, CANCELLED, EXPIRED]
        startsAt:
          type: string
          format: date-time
          nullable: true
        expiresAt:
          type: string
          format: date-time
          nullable: true
    CreateSubscriptionPaymentRequest:
      type: object
      required: [planCode, customerEmail, customerName]
      properties:
        planCode:
          type: string
          enum: [MONTHLY, YEARLY]
        customerEmail:
          type: string
          format: email
        customerName:
          type: string
          minLength: 1
          maxLength: 120
        returnUrl:
          type: string
          format: uri
    SubscriptionPayment:
      type: object
      required: [subscriptionId, checkoutUrl, status]
      properties:
        subscriptionId:
          type: integer
        checkoutUrl:
          type: string
          format: uri
        status:
          type: string
    SubscriptionReconciliation:
      type: object
      required: [checked, activated, failed]
      properties:
        checked:
          type: integer
        activated:
          type: integer
        failed:
          type: integer
    HealthStatus:
      type: object
      properties:
        status:
          type: string
          enum: [ready, not_ready]
        ready:
          type: boolean
        checks:
          type: object
          properties:
            database:
              type: string
              enum: [missing, checking, ready, unavailable]
            jwt:
              type: string
              enum: [missing, configured]
          required: [database, jwt]
        message:
          type: string
      required:
        - status
        - ready
        - checks
        - message

