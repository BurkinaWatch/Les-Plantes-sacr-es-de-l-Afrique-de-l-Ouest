name: API PostgreSQL schema smoke

on:
  workflow_dispatch:
  schedule:
    # Railway's supported PostgreSQL majors can change independently of app
    # changes, so run this compatibility check weekly.
    - cron: "17 4 * * 1"
  push:
    paths:
      - "artifacts/api-server/**"
      - "lib/db/**"
      - "docs/railway-deployment.md"
      - ".github/workflows/api-postgres-schema-smoke.yml"

jobs:
  schema-smoke:
    name: PostgreSQL ${{ matrix.postgres-version }} schema smoke
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Source of truth for the PostgreSQL major versions supported by Railway.
        # Update this list when Railway changes its supported images.
        postgres-version: ["15", "16", "17"]
    services:
      postgres:
        image: postgres:${{ matrix.postgres-version }}
        env:
          POSTGRES_DB: schema_smoke
          POSTGRES_USER: schema_smoke
          POSTGRES_PASSWORD: schema_smoke_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U schema_smoke -d schema_smoke"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      READINESS_DATABASE_URL: postgresql://schema_smoke:schema_smoke_password@127.0.0.1:5432/schema_smoke
      READINESS_CONNECTION_MODE: railway-tls
      POSTGRES_VERSION: ${{ matrix.postgres-version }}
      SERVICE_DATABASE_USER: railway_api_smoke
      SERVICE_DATABASE_PASSWORD: railway_api_smoke_password

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.26.1
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify schema migrations and field drift detection on PostgreSQL ${{ matrix.postgres-version }}
        run: pnpm --filter @workspace/api-server run check:postgres-schema-smoke
      - name: Configure disposable PostgreSQL TLS for the Railway connection check
        env:
          POSTGRES_VERSION: ${{ matrix.postgres-version }}
        run: |
          set -euo pipefail

          container_id="$(docker ps --filter "ancestor=postgres:${POSTGRES_VERSION}" --format '{{.ID}}' | head -n 1)"
          if [ -z "$container_id" ]; then
            echo "Could not locate the PostgreSQL ${POSTGRES_VERSION} service container." >&2
            exit 1
          fi

          tls_dir="${RUNNER_TEMP}/postgres-railway-tls"
          mkdir -p "$tls_dir"
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 \
            -subj "/CN=disposable-postgres-ca" \
            -keyout "$tls_dir/ca.key" \
            -out "$tls_dir/ca.crt"
          openssl req -newkey rsa:2048 -nodes \
            -subj "/CN=127.0.0.1" \
            -keyout "$tls_dir/server.key" \
            -out "$tls_dir/server.csr"
          cat > "$tls_dir/server.ext" <<'EOF'
          subjectAltName = IP:127.0.0.1
          extendedKeyUsage = serverAuth
          EOF
          openssl x509 -req -days 1 \
            -in "$tls_dir/server.csr" \
            -CA "$tls_dir/ca.crt" \
            -CAkey "$tls_dir/ca.key" \
            -CAcreateserial \
            -extfile "$tls_dir/server.ext" \
            -out "$tls_dir/server.crt"

          docker cp "$tls_dir/server.crt" "$container_id:/var/lib/postgresql/data/server.crt"
          docker cp "$tls_dir/server.key" "$container_id:/var/lib/postgresql/data/server.key"
          docker exec "$container_id" chown postgres:postgres \
            /var/lib/postgresql/data/server.crt /var/lib/postgresql/data/server.key
          docker exec "$container_id" chmod 600 /var/lib/postgresql/data/server.key
          docker exec "$container_id" psql -U schema_smoke -d schema_smoke \
            -v ON_ERROR_STOP=1 \
            -c "ALTER SYSTEM SET ssl = 'on'"
          docker restart "$container_id"
          for attempt in $(seq 1 30); do
            if docker exec "$container_id" pg_isready -U schema_smoke -d schema_smoke; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              echo "PostgreSQL ${POSTGRES_VERSION} did not become ready after TLS restart." >&2
              exit 1
            fi
            sleep 1
          done

          {
            printf 'READINESS_DATABASE_URL='
            printf '%s' "postgresql://schema_smoke:schema_smoke_password@127.0.0.1:5432/schema_smoke"
            printf '?sslmode=require&sslrootcert=%s&application_name=railway-schema-smoke&connect_timeout=10\n' "$tls_dir/ca.crt"
            printf 'SERVICE_DATABASE_URL='
            printf '%s' "postgresql://${SERVICE_DATABASE_USER}:${SERVICE_DATABASE_PASSWORD}@127.0.0.1:5432/schema_smoke"
            printf '?sslmode=require&sslrootcert=%s&application_name=railway-service-schema-smoke&connect_timeout=10\n' "$tls_dir/ca.crt"
          } >> "$GITHUB_ENV"
      - name: Verify Railway SSL and URL parameters on PostgreSQL ${{ matrix.postgres-version }}
        run: pnpm --filter @workspace/api-server run check:postgres-readiness
      - name: Create a non-privileged Railway API role on PostgreSQL ${{ matrix.postgres-version }}
        run: |
          set -euo pipefail

          psql "$READINESS_DATABASE_URL" --set=ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE railway_api_smoke
            LOGIN
            PASSWORD 'railway_api_smoke_password'
            NOSUPERUSER
            NOCREATEDB
            NOCREATEROLE
            NOINHERIT
            NOREPLICATION
            NOBYPASSRLS;

          DO $$
          DECLARE
            role_record pg_roles%ROWTYPE;
          BEGIN
            SELECT *
            INTO role_record
            FROM pg_roles
            WHERE rolname = 'railway_api_smoke';

            IF role_record.rolsuper
              OR role_record.rolcreatedb
              OR role_record.rolcreaterole
              OR role_record.rolreplication
              OR role_record.rolbypassrls THEN
              RAISE EXCEPTION 'railway_api_smoke must not have administrative privileges';
            END IF;
          END $$;

          GRANT CONNECT ON DATABASE schema_smoke TO railway_api_smoke;
          GRANT USAGE ON SCHEMA public TO railway_api_smoke;
          GRANT SELECT ON ALL TABLES IN SCHEMA public TO railway_api_smoke;
          GRANT USAGE, SELECT ON ALL SEQUENCES IN SCHEMA public TO railway_api_smoke;
          SQL
      - name: Verify a real backup restores data and schema on PostgreSQL ${{ matrix.postgres-version }}
        env:
          SOURCE_DATABASE_URL: postgresql://schema_smoke:schema_smoke_password@127.0.0.1:5432/schema_smoke
          RESTORE_ADMIN_DATABASE_URL: postgresql://schema_smoke:schema_smoke_password@127.0.0.1:5432/schema_smoke_restore
        run: |
          set -euo pipefail

          backup_file="$RUNNER_TEMP/schema-smoke-${POSTGRES_VERSION}.dump"
          service_restore_database_url="${SERVICE_DATABASE_URL/schema_smoke/schema_smoke_restore}"
          psql --version
          pg_dump --version
          pg_restore --version

          psql "$SOURCE_DATABASE_URL" --set=ON_ERROR_STOP=1 <<'SQL'
          INSERT INTO users (username, password_hash)
          VALUES ('backup-restore-smoke-user', 'backup-restore-smoke-hash')
          ON CONFLICT (username)
          DO UPDATE SET password_hash = EXCLUDED.password_hash
          RETURNING id \gset backup_

          INSERT INTO push_tokens (user_id, token, platform)
          VALUES (:backup_id, 'backup-restore-smoke-token', 'ci')
          ON CONFLICT (token)
          DO UPDATE SET user_id = EXCLUDED.user_id, platform = EXCLUDED.platform;
          SQL

          pg_dump \
            --format=custom \
            --no-owner \
            --no-acl \
            --file="$backup_file" \
            "$SOURCE_DATABASE_URL"
          test -s "$backup_file"
          printf 'Backup archive created: %s bytes\n' "$(wc -c < "$backup_file")"
          sha256sum "$backup_file"

          psql "$SOURCE_DATABASE_URL" --set=ON_ERROR_STOP=1 \
            --command='DROP DATABASE IF EXISTS schema_smoke_restore'
          psql "$SOURCE_DATABASE_URL" --set=ON_ERROR_STOP=1 \
            --command='CREATE DATABASE schema_smoke_restore'
          psql "$RESTORE_ADMIN_DATABASE_URL" --set=ON_ERROR_STOP=1 <<'SQL'
          GRANT CONNECT ON DATABASE schema_smoke_restore TO railway_api_smoke;
          GRANT USAGE, CREATE ON SCHEMA public TO railway_api_smoke;
          SQL
          pg_restore \
            --exit-on-error \
            --no-owner \
            --no-acl \
            --dbname="$service_restore_database_url" \
            "$backup_file"

          psql "$service_restore_database_url" --set=ON_ERROR_STOP=1 <<'SQL'
          DO $$
          DECLARE
            restored_user_id integer;
            restored_token_user_id integer;
          BEGIN
            IF NOT EXISTS (
              SELECT 1
              FROM schema_migrations
              WHERE version = 1
            ) THEN
              RAISE EXCEPTION 'Restored schema_migrations does not contain version 1';
            END IF;

            SELECT id
            INTO restored_user_id
            FROM users
            WHERE username = 'backup-restore-smoke-user';

            IF restored_user_id IS NULL THEN
              RAISE EXCEPTION 'Restored users row is missing';
            END IF;

            IF NOT EXISTS (
              SELECT 1
              FROM users
              WHERE id = restored_user_id
                AND password_hash = 'backup-restore-smoke-hash'
            ) THEN
              RAISE EXCEPTION 'Restored users data does not match the backup';
            END IF;

            SELECT user_id
            INTO restored_token_user_id
            FROM push_tokens
            WHERE token = 'backup-restore-smoke-token';

            IF restored_token_user_id IS DISTINCT FROM restored_user_id THEN
              RAISE EXCEPTION 'Restored push_tokens relationship does not match the backup';
            END IF;
          END $$;
          SQL

          READINESS_DATABASE_URL="$service_restore_database_url" \
            pnpm --filter @workspace/api-server run check:postgres-readiness
          printf 'Backup restore verification passed: representative data and schema were recovered with the non-privileged Railway API role.\n'
